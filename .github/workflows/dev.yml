name: Owlplug Dev

on: 
  push:
    branches:
      - '**'
      - '!master'
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  # On push, check whether the branch already has an open pull request.
  # If so, the pull_request run builds it and the push run is skipped.
  check-pr:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      has_pr: ${{ steps.check.outputs.has_pr }}
    steps:
    - id: check
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        count=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --state open \
          --json headRepositoryOwner \
          --jq "[.[] | select(.headRepositoryOwner.login == \"$GITHUB_REPOSITORY_OWNER\")] | length")
        if [ "$count" -gt 0 ]; then echo "has_pr=true" >> "$GITHUB_OUTPUT"; else echo "has_pr=false" >> "$GITHUB_OUTPUT"; fi

  test:
    needs: check-pr
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || needs.check-pr.outputs.has_pr != 'true') }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 27
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: 27
        cache: 'maven'
    - name: Build maven parent project
      run: mvn -B install -DskipTests
    - name: Run Test
      run: mvn test
