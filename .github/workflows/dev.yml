name: Owlplug Dev

on: 
  push:
    branches:
      - '**'
      - '!master'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Branches from this repository are already built on push: only run
    # pull_request events for PRs coming from forks to avoid duplicate runs.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 27
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: 27
        cache: 'maven'
    - name: Build maven parent project
      run: mvn -B install -DskipTests
    - name: Run Test
      run: mvn test
